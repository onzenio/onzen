name: wzap

on:
  push:
    paths:
      - "wzap/**"
  pull_request:
    paths:
      - "wzap/**"

permissions:
  contents: read

jobs:
  wzap:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wzap

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: onefisc_wzap_test
          POSTGRES_USER: onefisc
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onefisc -d onefisc_wzap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WZAP_TEST_DATABASE_URL: postgres://onefisc:secret@127.0.0.1:5432/onefisc_wzap_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: wzap/go.mod
          cache-dependency-path: wzap/go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: wzap

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
